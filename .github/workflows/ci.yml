name: PR Tests

# Runs on every PR into main. Four test stages feed a shared JUnit -> HTML/ODS
# report pipeline, aggregated and published by two further jobs. Three of the
# four (typecheck, verify-migrations, frontend-tests) have no interdependency
# between them - on this single self-hosted runner they still queue one after
# another, but this keeps each stage's pass/fail visible on its own and keeps
# the door open for more runners later. api-tests depends on verify-migrations
# so it runs its test suite against an already-migrated, already-verified
# database instead of re-applying migrations itself.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1: typecheck (api `tsc --noEmit` + frontend `vue-tsc --build`)
  # ---------------------------------------------------------------------------
  typecheck:
    name: Typecheck
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable corepack
        run: corepack enable

      - name: Install api dependencies
        working-directory: zuti-clicker/api
        run: pnpm install --frozen-lockfile

      # prisma.config.ts resolves DATABASE_URL/SHADOW_DATABASE_URL via
      # dotenv even for `generate` (which never connects, just needs the
      # vars present) - same dummy values the api Dockerfile's build ARGs
      # use for the same reason, since there's no real .env in this job.
      - name: Generate Prisma client
        working-directory: zuti-clicker/api
        env:
          DATABASE_URL: mysql://build:build@build:3306/build
          SHADOW_DATABASE_URL: mysql://build:build@build:3306/buildShadow
        run: pnpm exec prisma generate

      # `pnpm build` is not used here: api/tsconfig.json has no outDir/include,
      # so plain `tsc` would emit .js next to sources. `tsc --noEmit` is the
      # reliable typecheck-only gate (see CLAUDE.md / the CI/CD plan).
      - name: Typecheck api
        id: api_typecheck
        working-directory: zuti-clicker/api
        run: |
          SECONDS=0
          set +e
          pnpm exec tsc --noEmit > /tmp/zuti-api-typecheck.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          echo "duration=$SECONDS" >> "$GITHUB_OUTPUT"
          set -e
          cat /tmp/zuti-api-typecheck.log

      - name: Install frontend dependencies
        working-directory: zuti-clicker/frontend
        run: pnpm install --frozen-lockfile

      - name: Typecheck frontend
        id: frontend_typecheck
        working-directory: zuti-clicker/frontend
        run: |
          SECONDS=0
          set +e
          pnpm run type-check > /tmp/zuti-frontend-typecheck.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          echo "duration=$SECONDS" >> "$GITHUB_OUTPUT"
          set -e
          cat /tmp/zuti-frontend-typecheck.log

      # Neither tsc nor vue-tsc emits JUnit XML, so this stage's report is a
      # small hand-written one (two synthetic cases) - it still flows through
      # the same junit-report.mjs pipeline as the real Jest/Vitest suites.
      - name: Write JUnit report
        if: always()
        run: |
          mkdir -p reports
          api_status="${{ steps.api_typecheck.outputs.exit_code }}"
          fe_status="${{ steps.frontend_typecheck.outputs.exit_code }}"
          api_dur="${{ steps.api_typecheck.outputs.duration }}"
          fe_dur="${{ steps.frontend_typecheck.outputs.duration }}"
          api_failure=""
          fe_failure=""
          failures=0
          if [ "$api_status" != "0" ]; then
            failures=$((failures + 1))
            api_failure="<failure message=\"tsc --noEmit exited with code ${api_status}\">See the Typecheck api step log</failure>"
          fi
          if [ "$fe_status" != "0" ]; then
            failures=$((failures + 1))
            fe_failure="<failure message=\"vue-tsc --build exited with code ${fe_status}\">See the Typecheck frontend step log</failure>"
          fi
          total_time=$((api_dur + fe_dur))
          cat > reports/junit-typecheck-${{ github.run_number }}.xml <<XML
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites name="typecheck" tests="2" failures="${failures}" time="${total_time}">
            <testsuite name="typecheck" tests="2" failures="${failures}" time="${total_time}">
              <testcase classname="typecheck" name="api: tsc --noEmit" time="${api_dur}">${api_failure}</testcase>
              <testcase classname="typecheck" name="frontend: vue-tsc --build" time="${fe_dur}">${fe_failure}</testcase>
            </testsuite>
          </testsuites>
          XML
          cat reports/junit-typecheck-${{ github.run_number }}.xml

      # Named junit-<stage>.xml (not plain junit.xml) so it can upload
      # unzipped (archive: false) with a name that won't collide with the
      # other two stages' otherwise-identically-named files.
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: reports/junit-typecheck-${{ github.run_number }}.xml
          archive: false
          retention-days: 14
          if-no-files-found: warn

      - name: Fail job if typecheck failed
        if: always()
        run: |
          if [ "${{ steps.api_typecheck.outputs.exit_code }}" != "0" ] || [ "${{ steps.frontend_typecheck.outputs.exit_code }}" != "0" ]; then
            echo "::error::Typecheck failed - see the step logs above"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Stage 2: verify migrations. This is the pre-merge proof that a migration
  # is *correct*, not just that it happens to exist — deploy.yml's `migrate`
  # job applies pending migrations to the live production database on every
  # push to main with no human approval step and no staging database, so
  # this is the only automated gate standing between a bad migration and
  # production. Two checks, both against the real, dedicated zutiClickerTest
  # database (see the "Load CI environment file" step below):
  #   1. `prisma migrate deploy` — does the migration SQL apply cleanly at
  #      all against a real MariaDB instance?
  #   2. `prisma migrate diff --from-config-datasource --to-schema ... --exit-code`
  #      — after applying, does the live schema *exactly* match what
  #      prisma/schema.prisma declares? This catches the mistake `migrate
  #      deploy` alone can't: schema.prisma edited without a matching
  #      migration (or vice versa) — both empirically verified against the
  #      real zutiClickerTest database (exit 0 / "No difference detected."
  #      when they match, exit 2 with a readable diff when a field was
  #      artificially removed from a throwaway schema copy).
  # ---------------------------------------------------------------------------
  verify-migrations:
    name: Verify migrations
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        working-directory: zuti-clicker/api
        run: pnpm install --frozen-lockfile

      # Same runner-local file api-tests uses below (never a GitHub secret) —
      # both jobs apply migrations to the same dedicated zutiClickerTest
      # database, so api-tests (which needs this job to finish first) runs
      # its actual test suite against an already-migrated, already-verified
      # schema instead of re-applying migrations itself.
      - name: Load CI environment file
        id: load_env
        working-directory: zuti-clicker/api
        run: |
          ENV_CI_FILE="/mnt/raid1/zuti-clicker-ci/.env.ci"
          if [ ! -f "$ENV_CI_FILE" ]; then
            echo "::error::Missing $ENV_CI_FILE on this runner - see 'What I need from you' in the CI/CD plan for its required contents."
            exit 1
          fi
          cp "$ENV_CI_FILE" .env

          while IFS='=' read -r key value; do
            [ -z "$key" ] && continue
            case "$key" in \#*) continue ;; esac
            value="${value%$'\r'}"
            if [[ "$value" == \"*\" && "$value" == *\" ]]; then
              value="${value:1:-1}"
            elif [[ "$value" == \'*\' && "$value" == *\' ]]; then
              value="${value:1:-1}"
            fi
            echo "::add-mask::$value"
            {
              echo "${key}<<CI_ENV_VALUE_EOF"
              echo "$value"
              echo "CI_ENV_VALUE_EOF"
            } >> "$GITHUB_ENV"
          done < "$ENV_CI_FILE"

      - name: Generate Prisma client
        working-directory: zuti-clicker/api
        run: pnpm exec prisma generate

      - name: Apply migrations to the test database
        id: migrate_deploy
        working-directory: zuti-clicker/api
        run: |
          SECONDS=0
          set +e
          pnpm exec prisma migrate deploy > /tmp/zuti-migrate-deploy.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          echo "duration=$SECONDS" >> "$GITHUB_OUTPUT"
          set -e
          cat /tmp/zuti-migrate-deploy.log

      # Only meaningful once migrate deploy above actually succeeded - a
      # schema that failed to even apply has nothing useful to diff.
      - name: Verify schema.prisma matches the applied migrations
        id: migrate_diff
        if: steps.migrate_deploy.outputs.exit_code == '0'
        working-directory: zuti-clicker/api
        run: |
          SECONDS=0
          set +e
          pnpm exec prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema.prisma \
            --exit-code > /tmp/zuti-migrate-diff.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          echo "duration=$SECONDS" >> "$GITHUB_OUTPUT"
          set -e
          cat /tmp/zuti-migrate-diff.log

      # Neither prisma command emits JUnit XML, so this stage's report is a
      # small hand-written one (two synthetic cases), same approach as the
      # typecheck stage above.
      - name: Write JUnit report
        if: always()
        run: |
          mkdir -p reports
          deploy_status="${{ steps.migrate_deploy.outputs.exit_code }}"
          diff_status="${{ steps.migrate_diff.outputs.exit_code }}"
          deploy_dur="${{ steps.migrate_deploy.outputs.duration }}"
          diff_dur="${{ steps.migrate_diff.outputs.duration }}"
          deploy_failure=""
          diff_failure=""
          failures=0
          if [ "$deploy_status" != "0" ]; then
            failures=$((failures + 1))
            deploy_failure="<failure message=\"prisma migrate deploy exited with code ${deploy_status}\">See the Apply migrations step log</failure>"
          fi
          if [ -z "$diff_status" ] || [ "$diff_status" != "0" ]; then
            failures=$((failures + 1))
            diff_failure="<failure message=\"prisma migrate diff exited with code ${diff_status:-skipped}\">See the Verify schema.prisma step log</failure>"
          fi
          total_time=$((deploy_dur + ${diff_dur:-0}))
          cat > reports/junit-migrations-${{ github.run_number }}.xml <<XML
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites name="migrations" tests="2" failures="${failures}" time="${total_time}">
            <testsuite name="migrations" tests="2" failures="${failures}" time="${total_time}">
              <testcase classname="migrations" name="migrate deploy applies cleanly" time="${deploy_dur}">${deploy_failure}</testcase>
              <testcase classname="migrations" name="schema.prisma matches the applied migrations (no drift)" time="${diff_dur:-0}">${diff_failure}</testcase>
            </testsuite>
          </testsuites>
          XML
          cat reports/junit-migrations-${{ github.run_number }}.xml

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: reports/junit-migrations-${{ github.run_number }}.xml
          archive: false
          retention-days: 14
          if-no-files-found: warn

      - name: Fail job if migration verification failed
        if: always()
        run: |
          if [ "${{ steps.migrate_deploy.outputs.exit_code }}" != "0" ] || [ "${{ steps.migrate_diff.outputs.exit_code }}" != "0" ]; then
            echo "::error::Migration verification failed - see the step logs above"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Stage 3: frontend tests (Vitest, no server/DB involved)
  # ---------------------------------------------------------------------------
  frontend-tests:
    name: Frontend tests
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        working-directory: zuti-clicker/frontend
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: zuti-clicker/frontend
        run: >
          pnpm exec vitest run --reporter=default --reporter=junit
          --outputFile.junit=reports/junit-frontend-tests-${{ github.run_number }}.xml

      # Named junit-<stage>.xml (not plain junit.xml) so it can upload
      # unzipped (archive: false) with a name that won't collide with the
      # other two stages' otherwise-identically-named files.
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: zuti-clicker/frontend/reports/junit-frontend-tests-${{ github.run_number }}.xml
          archive: false
          retention-days: 14
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Stage 4: api tests (Jest/supertest integration tests against a real,
  # dedicated zutiClickerTest database - see CLAUDE.md "Database & migrations"
  # and the CI/CD plan's "What I need from you" section for how the runner's
  # CI env file is provisioned). Depends on verify-migrations so the database
  # is already migrated (and verified correct) by the time these tests run.
  # ---------------------------------------------------------------------------
  api-tests:
    name: API tests
    needs: [verify-migrations]
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        working-directory: zuti-clicker/api
        run: pnpm install --frozen-lockfile

      # Runner-local file (never a GitHub secret, per the CI/CD plan) holding
      # DATABASE_* creds for the dedicated zutiClickerTest DB + a throwaway
      # CRYPTO_SECRET_KEY. Never touches production data.
      - name: Load CI environment file
        id: load_env
        working-directory: zuti-clicker/api
        run: |
          ENV_CI_FILE="/mnt/raid1/zuti-clicker-ci/.env.ci"
          if [ ! -f "$ENV_CI_FILE" ]; then
            echo "::error::Missing $ENV_CI_FILE on this runner - see 'What I need from you' in the CI/CD plan for its required contents."
            exit 1
          fi
          cp "$ENV_CI_FILE" .env

          # Also export every key into $GITHUB_ENV (real process env for all
          # later steps), not just the file: dotenv (used by both
          # prisma.config.ts and src/index.ts) never overrides a variable
          # that's already set in the environment, even to an empty string -
          # and this runner is a persistent, non-ephemeral machine, so an
          # already-set DATABASE_URL etc. from outside this workflow would
          # otherwise silently win over the file we just copied in.
          while IFS='=' read -r key value; do
            [ -z "$key" ] && continue
            case "$key" in \#*) continue ;; esac
            # Strip CR (CRLF files) and a single layer of surrounding
            # matching quotes, mirroring dotenv's own parsing - `cp` alone
            # relies on dotenv to do this for the .env file, but this loop
            # re-exports the raw value itself and must match that behavior
            # (api/.env.example quotes DATABASE_URL etc., and without this
            # the quotes end up as literal characters in the exported var).
            value="${value%$'\r'}"
            if [[ "$value" == \"*\" && "$value" == *\" ]]; then
              value="${value:1:-1}"
            elif [[ "$value" == \'*\' && "$value" == *\' ]]; then
              value="${value:1:-1}"
            fi
            # GitHub Actions prints every step's full resolved env dict in
            # the log, and $GITHUB_ENV values are NOT auto-masked the way
            # secrets.* are - explicitly mask before export or every value
            # from this file (DB password included) leaks in plain text on
            # every later step, in this public repo's Actions log.
            echo "::add-mask::$value"
            {
              echo "${key}<<CI_ENV_VALUE_EOF"
              echo "$value"
              echo "CI_ENV_VALUE_EOF"
            } >> "$GITHUB_ENV"
          done < "$ENV_CI_FILE"

      - name: Generate Prisma client
        working-directory: zuti-clicker/api
        run: pnpm exec prisma generate

      # Tests hit a hardcoded http://localhost:2710 (src/constants/test-data.ts)
      # so the server has to be listening on exactly that port before `pnpm test`.
      - name: Start API server
        working-directory: zuti-clicker/api
        run: |
          if ss -ltn "( sport = :2710 )" 2>/dev/null | grep -q ':2710'; then
            echo "::error::Port 2710 is already in use on this runner - a previous run may not have shut down cleanly."
            exit 1
          fi
          nohup pnpm exec tsx src/index.ts > /tmp/zuti-api-ci.log 2>&1 &
          echo $! > /tmp/zuti-api-ci.pid
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:2710/docs > /dev/null 2>&1; then
              echo "API server is up (pid $(cat /tmp/zuti-api-ci.pid))"
              exit 0
            fi
            sleep 1
          done
          echo "::error::API server did not become healthy within 30s"
          cat /tmp/zuti-api-ci.log
          exit 1

      - name: Run API tests
        working-directory: zuti-clicker/api
        env:
          JEST_JUNIT_OUTPUT_DIR: reports
          JEST_JUNIT_OUTPUT_NAME: junit-api-tests-${{ github.run_number }}.xml
        run: >
          node --experimental-vm-modules node_modules/jest/bin/jest.js
          --config=jest.config.cjs --reporters=default --reporters=jest-junit

      - name: Dump API server log on failure
        if: failure()
        run: cat /tmp/zuti-api-ci.log || true

      - name: Stop API server
        if: always()
        run: |
          if [ -f /tmp/zuti-api-ci.pid ]; then
            kill "$(cat /tmp/zuti-api-ci.pid)" 2>/dev/null || true
            rm -f /tmp/zuti-api-ci.pid
          fi

      # The suite creates real test_<random>@example.com rows in
      # zutiClickerTest; reap them the same way CLAUDE.md prescribes for the
      # live DB (api/scripts/cleanup-test-users.ts), even though this is a
      # dedicated test database, so it doesn't grow unbounded across PRs.
      - name: Cleanup test users
        # Skip cleanly rather than crash on a missing Prisma client if the
        # env file (and therefore everything after it) never even loaded.
        if: always() && steps.load_env.outcome == 'success'
        working-directory: zuti-clicker/api
        run: pnpm cleanup:test-users --apply

      # Named junit-<stage>.xml (not plain junit.xml) so it can upload
      # unzipped (archive: false) with a name that won't collide with the
      # other two stages' otherwise-identically-named files.
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: zuti-clicker/api/reports/junit-api-tests-${{ github.run_number }}.xml
          archive: false
          retention-days: 14
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Aggregation: turns the three junit-* artifacts into report.html/.ods and
  # a reusable summary.md/summary.json, regardless of whether any stage failed.
  # ---------------------------------------------------------------------------
  reports:
    name: Aggregate reports
    needs: [typecheck, verify-migrations, frontend-tests, api-tests]
    if: always()
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable corepack
        run: corepack enable

      - name: Install report generator dependencies
        working-directory: .github/scripts
        run: pnpm install --frozen-lockfile

      - name: Download JUnit artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: junit-*
          path: artifacts

      # --suffix appends the run number to every output filename, so
      # downloading the same report across different runs into one local
      # folder never collides.
      - name: Generate HTML/ODS/summary reports
        working-directory: .github/scripts
        run: |
          node junit-report.mjs \
            --input "${{ github.workspace }}/artifacts" \
            --out "${{ github.workspace }}/test-reports" \
            --suffix "${{ github.run_number }}"

      # Uploaded individually (archive: false) rather than as one zipped
      # bundle, so each is directly downloadable/viewable from the run's
      # Artifacts list without extracting anything first.
      - name: Upload report.html
        uses: actions/upload-artifact@v7
        with:
          path: test-reports/report-${{ github.run_number }}.html
          archive: false
          retention-days: 30

      - name: Upload report.ods
        uses: actions/upload-artifact@v7
        with:
          path: test-reports/report-${{ github.run_number }}.ods
          archive: false
          retention-days: 30

      - name: Upload summary.md
        uses: actions/upload-artifact@v7
        with:
          path: test-reports/summary-${{ github.run_number }}.md
          archive: false
          retention-days: 30

      - name: Upload summary.json
        uses: actions/upload-artifact@v7
        with:
          path: test-reports/summary-${{ github.run_number }}.json
          archive: false
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Publishing: job summary + a sticky PR comment (updated in place across
  # pushes) + inline check-run annotations for failed tests.
  # ---------------------------------------------------------------------------
  summary:
    name: Publish summary
    needs: [reports]
    if: always()
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      # Only summary.md is needed here (job summary + PR comment body) - the
      # other report files are individual, unzipped artifacts on the run
      # page for anyone who wants report.html/report.ods/summary.json.
      - name: Download summary.md
        uses: actions/download-artifact@v8
        with:
          name: summary-${{ github.run_number }}.md
          path: test-reports

      - name: Download raw JUnit files (for annotations)
        uses: actions/download-artifact@v8
        with:
          pattern: junit-*
          path: artifacts

      - name: Publish job summary
        run: cat "test-reports/summary-${{ github.run_number }}.md" >> "$GITHUB_STEP_SUMMARY"

      # A fork PR's GITHUB_TOKEN is read-only no matter what this job's
      # `permissions:` block says, so issues.createComment/updateComment
      # throws "Resource not accessible by integration" and fails this whole
      # job even though every test stage passed (see PR #25, run 34969728756
      # - every job green except this one). Job summary + check-run
      # annotations below don't need write access and already work on forks;
      # only the PR comment does, so it's the one that needs gating. The `if:`
      # below is the fix - it fully excludes the one case that's known to
      # fail, so a real failure on a same-repo PR (API outage, a script bug)
      # still fails this job rather than being swallowed.
      - name: Post sticky PR comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("test-reports/summary-${{ github.run_number }}.md", "utf-8");
            const marker = "<!-- zuti-clicker-ci-summary -->";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const commentBody = `${marker}\n## Test summary\n\n${body}\n[Full HTML/ODS report](${runUrl})\n`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }

      - name: Note skipped PR comment for fork PRs
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: echo "ℹ️ Sticky PR comment skipped - fork PRs get a read-only token and can't post comments. See the job summary above and the check-run annotations below for results." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish check-run annotations
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: "artifacts/junit-*/*.xml"
          check_name: "Test annotations"
          include_passed: false
          fail_on_failure: false
          annotate_only: true
